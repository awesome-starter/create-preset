name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
      release-version:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: create-preset-binary-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Setup Node.js for CLI regressions
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release manifests
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run test:release
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then RELEASE_VERSION="${GITHUB_REF_NAME#v}"; fi
          node scripts/release.mjs check "$RELEASE_VERSION"
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Build npm host package
        run: npm run build
      - name: Verify packed package and installed commands
        run: npm run test:package

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # macOS
          - os: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - os: darwin
            arch: x64
            runner: macos-latest
            target: x86_64-apple-darwin

          # Linux
          - os: linux
            arch: x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu

          # Windows
          - os: win
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (Unix)
        if: matrix.os != 'win'
        run: |
          mkdir -p binaries
          cp target/${{ matrix.target }}/release/preset binaries/preset-${{ matrix.os }}-${{ matrix.arch }}
          chmod +x binaries/preset-${{ matrix.os }}-${{ matrix.arch }}

      - name: Prepare binary (Windows)
        if: matrix.os == 'win'
        run: |
          mkdir -p binaries
          cp target/${{ matrix.target }}/release/preset.exe binaries/preset-${{ matrix.os }}-${{ matrix.arch }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: preset-${{ matrix.os }}-${{ matrix.arch }}
          path: binaries/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: preset-*

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11 --ignore-scripts --no-audit --no-fund

      - name: Download automatic release notes
        if: inputs.publish
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-metadata

      - name: Prepare npm distribution and restore executable permissions
        run: node scripts/prepare-release.js

      - name: Verify npm package
        working-directory: dist
        run: |
          node bin/preset.js --version
          npm pack --dry-run --ignore-scripts

      - name: Publish to npm with OIDC
        working-directory: dist
        # A rerun after npm succeeds but GitHub fails must finish the same
        # release instead of trying to publish an immutable version twice.
        run: node ../scripts/publish-release.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release-version && format('v{0}', inputs.release-version) || github.ref_name }}
          target_commitish: ${{ inputs.source-ref || github.sha }}
          files: dist/binaries/*
          generate_release_notes: true
          body_path: ${{ inputs.publish && 'release-metadata/release-notes.md' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
