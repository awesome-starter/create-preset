name: Rust CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize main releases so two merges cannot choose the same version.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release automation
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test:release
          node scripts/release.mjs check

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Build npm host package
        run: pnpm run build

      - name: Verify packed package and installed commands
        run: pnpm run test:package

  prepare-release:
    name: Plan automatic version
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Ignore superseded main runs
        id: current
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Analyze commits and synchronize release manifests
        id: plan
        if: steps.current.outputs.current == 'true'
        run: node scripts/release.mjs prepare
      - name: Commit synchronized release metadata
        id: commit
        if: steps.plan.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json Cargo.toml Cargo.lock CHANGELOG.md
          git diff --cached --quiet || git commit -m "release: v$RELEASE_VERSION [skip ci]"
          git push origin HEAD:main
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Save release notes
        if: steps.plan.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  publish:
    name: Build and publish automatic release
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/build-binaries.yml
    with:
      source-ref: ${{ needs.prepare-release.outputs.ref }}
      release-version: ${{ needs.prepare-release.outputs.version }}
      publish: true
    secrets: inherit
